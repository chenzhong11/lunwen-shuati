# CWRU 数据集配置示例（legacy/generic data-module example）
# ==================
# 注意：本文件不是正式 Phase 1 WDCNN 配置。正式输入长度统一由
# config/default.yaml 的 2048 和 create_scenario() 数据流定义。

# 数据路径配置
data:
  raw_path: "./data/raw/cwru"
  processed_path: "./data/processed"
  output_path: "./data/output"

# 数据加载配置
loader:
  fault_types:
    - "normal"
    - "ball_007"
    - "ball_014"
    - "ball_021"
    - "inner_007"
    - "inner_014"
    - "inner_021"
    - "outer_007"
    - "outer_014"
    - "outer_021"
  
  load_conditions: [0, 1, 2, 3]
  channel: "DE"
  sample_rate: 12000

# 预处理配置
preprocessing:
  window_length: 1024  # legacy/example only; formal Phase 1 uses 2048
  overlap: 0.5
  normalize_method: "z-score"
  
# 数据集配置
dataset:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  
# 场景配置
scenarios:
  cross_load:
    train_loads: [0, 1]
    test_loads: [2, 3]
    val_ratio: 0.2
    
  cross_fault:
    train_faults: ["normal", "ball_007", "inner_007"]
    test_faults: ["ball_014", "inner_014"]
    val_ratio: 0.2
    
  mixed:
    val_ratio: 0.15
    test_ratio: 0.15
    
# 数据泄漏检查配置
leakage_check:
  enabled: true
  check_type: "strict"
  generate_report: true
  report_path: "./reports/leakage_check.txt"
